<div class="flex min-h-full w-full flex-col bg-[#F1F5F9] dark:bg-transparent">
    <!-- ─── BREADCRUMB HEADER ─────────────────────────────────────────── -->
    <div class="flex items-center justify-between border-b bg-white px-8 py-4 text-sm dark:bg-card">
        <span class="font-semibold text-gray-800 dark:text-white">Exam Test Cases</span>
        <div class="text-secondary flex items-center gap-1">
            <span>Dashboard</span>
            <span>•</span>
            <a class="cursor-pointer hover:text-primary" [routerLink]="['/exams', 'dashboard']">Exams</a>
            <span>•</span>
            <a class="cursor-pointer hover:text-primary" [routerLink]="['/exams', examId]">{{ examId }}</a>
            <span>•</span>
            <span class="font-semibold text-primary">Test Cases</span>
        </div>
    </div>

    <div class="mx-8 mt-6">
        <!-- HEADER ────────────────────────────────────────────────────────── -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white tracking-tight">
                    Test Case Configuration
                </h1>
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Map Postman requests to test cases and define dependencies.</p>
            </div>
            <input
                #fileInput
                type="file"
                class="hidden"
                (change)="addNewTestCase(fileInput.files![0])"
                accept=".zip"
            />
            <button 
                (click)="fileInput.click()"
                [disabled]="isProcessing"
                class="flex items-center gap-2 rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-700 transition disabled:opacity-50"
            >
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Upload Test Collection (ZIP)
            </button>
        </div>

        <!-- ─── TREE TABLE ────────────────────────────────────────────────── -->
        <div class="rounded-2xl border border-gray-200 bg-white shadow-sm dark:border-gray-700 dark:bg-card overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-gray-50 text-gray-500 dark:bg-gray-800 dark:text-gray-400">
                        <tr>
                            <th class="px-6 py-4 font-medium">ID</th>
                            <th class="px-6 py-4 font-medium w-full">Storage Path</th>
                            <th class="px-6 py-4 font-medium text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
                        <!-- We loop through flat list and render appropriately -->
                        <ng-container *ngFor="let tc of testCases">
                            <tr class="transition-colors hover:bg-gray-50 dark:hover:bg-gray-800/50 group">
                                <td class="px-6 py-3">
                                    <span class="font-bold text-gray-900 dark:text-white">{{ tc.id }}</span>
                                </td>
                                <td class="px-6 py-3">
                                    <div class="text-sm text-gray-600 dark:text-gray-400 font-mono">
                                        {{ tc.filePath || 'No path' }}
                                    </div>
                                </td>
                                <td class="px-6 py-3 text-right">
                                    <div class="flex items-center justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                        <button 
                                            (click)="deleteTestCase(tc.id)"
                                            [disabled]="isProcessing"
                                            class="rounded p-1.5 text-gray-400 hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-900/30 dark:hover:text-red-400 disabled:opacity-50"
                                        >
                                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                            </svg>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </ng-container>
                        <tr *ngIf="testCases.length === 0">
                            <td colspan="3" class="px-6 py-12 text-center text-gray-500 dark:text-gray-400">
                                <p class="mt-1 text-sm">No test cases configured yet.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- Pagination Footer -->
            <div class="border-t border-gray-200 bg-gray-50 px-6 py-3 dark:border-gray-700 dark:bg-gray-800/50 flex justify-between items-center text-sm text-gray-500">
                <span>Total test cases: {{ testCases.length }}</span>
            </div>
        </div>
    </div>
</div>
