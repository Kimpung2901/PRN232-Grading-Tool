<div class="flex min-h-full w-full flex-col bg-[#F1F5F9] dark:bg-transparent">
    <!-- Page Header -->
    <div class="flex items-center justify-between border-b bg-white px-8 py-4 text-sm dark:bg-card">
        <a [routerLink]="['/exams/data', examId]" class="flex items-center gap-2 font-semibold text-gray-800 dark:text-white hover:text-primary transition">
            <mat-icon svgIcon="heroicons_outline:arrow-left" class="!h-4 !w-4"></mat-icon>
            Exam Detail
        </a>
        <div class="text-secondary flex items-center gap-1">
            <span>Exams</span><span>•</span>
            <span class="font-semibold text-primary">Test Cases</span>
        </div>
    </div>

    <div class="mx-8 mb-6 mt-6 rounded-2xl border border-gray-100 bg-white shadow-sm dark:border-gray-700 dark:bg-card overflow-hidden">
        <!-- Card Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between px-6 py-5 border-b border-gray-100 dark:border-gray-700">
            <div>
                <h1 class="text-xl font-bold text-gray-900 dark:text-white">Test Cases</h1>
                <p class="text-sm text-gray-500 mt-1 dark:text-gray-400">Upload and manage test case collections for Exam #{{ examId }}.</p>
            </div>
            <div class="mt-4 sm:mt-0">
                <button mat-flat-button color="primary" (click)="tcFileInput.click()" [disabled]="isProcessing" class="!rounded-xl gap-2">
                    <mat-spinner *ngIf="isProcessing" diameter="16"></mat-spinner>
                    <mat-icon *ngIf="!isProcessing" svgIcon="heroicons_outline:cloud-arrow-up" class="!h-4 !w-4"></mat-icon>
                    Upload Test Case
                </button>
                <input #tcFileInput type="file" class="hidden" (change)="onFileUpload($event)"/>
            </div>
        </div>

        <!-- Loading -->
        <div *ngIf="isLoading" class="flex items-center justify-center py-16">
            <mat-spinner diameter="40"></mat-spinner>
        </div>

        <!-- Table -->
        <div *ngIf="!isLoading" class="overflow-x-auto">
            <table mat-table [dataSource]="testCases" class="w-full">

                <!-- ID Column -->
                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef class="!w-20 !text-xs !font-bold !uppercase !tracking-wider !text-gray-500">ID</th>
                    <td mat-cell *matCellDef="let tc" class="font-mono text-xs text-gray-400">{{ tc.id }}</td>
                </ng-container>

                <!-- File Path Column -->
                <ng-container matColumnDef="filePath">
                    <th mat-header-cell *matHeaderCellDef class="!text-xs !font-bold !uppercase !tracking-wider !text-gray-500">File</th>
                    <td mat-cell *matCellDef="let tc">
                        <div class="flex items-center gap-2">
                            <div class="h-8 w-8 rounded-lg bg-blue-50 dark:bg-blue-900/30 flex items-center justify-center text-blue-600 dark:text-blue-400 flex-shrink-0">
                                <mat-icon svgIcon="heroicons_outline:document-text" class="!h-4 !w-4"></mat-icon>
                            </div>
                            <div>
                                <p class="font-semibold text-gray-800 dark:text-gray-200 text-sm">{{ getFileBasename(tc.filePath) }}</p>
                                <p class="font-mono text-xs text-gray-400 truncate max-w-sm">{{ tc.filePath }}</p>
                            </div>
                        </div>
                    </td>
                </ng-container>

                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef class="!text-right !text-xs !font-bold !uppercase !tracking-wider !text-gray-500">Actions</th>
                    <td mat-cell *matCellDef="let tc" class="text-right">
                        <button mat-icon-button color="warn" (click)="deleteTestCase(tc.id, tc.filePath)" [disabled]="isProcessing"
                            matTooltip="Delete test case"
                            class="opacity-0 group-hover:opacity-100 transition-opacity">
                            <mat-icon svgIcon="heroicons_outline:trash" class="!h-4 !w-4"></mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-gray-50 dark:bg-gray-800"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"
                    class="hover:bg-gray-50/80 dark:hover:bg-gray-800/50 transition-colors group">
                </tr>

                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell" colspan="3">
                        <div class="flex flex-col items-center gap-3 py-16 text-gray-400">
                            <mat-icon svgIcon="heroicons_outline:clipboard-document-list" class="!h-12 !w-12 opacity-30"></mat-icon>
                            <p class="font-semibold text-gray-600 dark:text-gray-300">No test cases uploaded</p>
                            <p class="text-sm">Upload a test case file to get started.</p>
                        </div>
                    </td>
                </tr>
            </table>
        </div>

        <!-- Footer -->
        <div class="border-t border-gray-100 px-6 py-4 bg-gray-50/50 dark:bg-gray-800/50 dark:border-gray-700 rounded-b-2xl text-sm text-gray-500 flex items-center gap-2">
            <mat-icon svgIcon="heroicons_outline:document-text" class="!h-4 !w-4 text-gray-400"></mat-icon>
            {{ testCases.length }} test case(s)
        </div>
    </div>
</div>
