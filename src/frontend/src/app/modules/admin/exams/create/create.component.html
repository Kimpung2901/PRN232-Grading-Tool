<div class="flex min-h-full w-full flex-col bg-[#F1F5F9] dark:bg-transparent">
    <div class="flex items-center justify-between border-b bg-white px-8 py-4 text-sm dark:bg-card">
        <a [routerLink]="['/exams']" class="font-semibold text-gray-800 dark:text-white hover:text-primary transition">← Exams</a>
        <div class="text-secondary flex items-center gap-1">
            <span>Exams</span><span>•</span>
            <span class="font-semibold text-primary">New Exam</span>
        </div>
    </div>

    <div class="mx-8 mb-6 mt-6 max-w-2xl">
        <div class="rounded-2xl border border-gray-100 bg-white shadow-sm dark:border-gray-700 dark:bg-card">
            <div class="px-6 py-5 border-b border-gray-100 dark:border-gray-700">
                <h1 class="text-xl font-bold text-gray-900 dark:text-white">Create New Exam</h1>
                <p class="text-sm text-gray-500 mt-1 dark:text-gray-400">Provide an exam name and upload the SQL initialization script.</p>
            </div>

            <form (ngSubmit)="onSubmit()" [formGroup]="form" class="p-6 space-y-6">
                <!-- Exam Name -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Exam Name <span class="text-red-500">*</span></label>
                    <input formControlName="name" type="text"
                        class="block w-full rounded-xl border border-gray-300 bg-white px-4 py-2.5 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
                        placeholder="e.g. Midterm PRN232 - Spring 2026"/>
                    <p *ngIf="form.get('name')?.touched && form.get('name')?.hasError('required')" class="mt-1 text-xs text-red-500">Exam name is required.</p>
                    <p *ngIf="form.get('name')?.touched && form.get('name')?.hasError('minlength')" class="mt-1 text-xs text-red-500">Must be at least 3 characters.</p>
                </div>

                <!-- SQL File Upload -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">SQL Initialization Script <span class="text-red-500">*</span></label>
                    <div (dragover)="onDragOver($event)" (dragleave)="onDragLeave()" (drop)="onDrop($event)"
                        [class.border-indigo-500]="isDragging"
                        class="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-xl p-8 text-center transition-colors cursor-pointer dark:border-gray-600"
                        (click)="sqlFileInput.click()">
                        <input #sqlFileInput type="file" accept=".sql" class="hidden" (change)="onFileSelect($event)"/>
                        <div *ngIf="!uploadedFile">
                            <svg class="mx-auto h-10 w-10 text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                            <p class="text-sm text-gray-600 dark:text-gray-400"><span class="font-semibold text-indigo-600">Click to upload</span> or drag and drop</p>
                            <p class="text-xs text-gray-400 mt-1">.sql files only</p>
                        </div>
                        <div *ngIf="uploadedFile" class="flex items-center gap-3">
                            <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-blue-50 text-blue-600">
                                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                            </div>
                            <div class="text-left">
                                <p class="text-sm font-medium text-gray-900 dark:text-white">{{ uploadedFile.name }}</p>
                                <p class="text-xs text-gray-500">{{ formatSize(uploadedFile.size) }}</p>
                            </div>
                            <button type="button" (click)="removeFile(); $event.stopPropagation()" class="ml-auto rounded-full p-1 text-gray-400 hover:bg-red-50 hover:text-red-500 transition">
                                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex gap-3 pt-2">
                    <button type="button" (click)="onCancel()" class="flex-1 rounded-xl border border-gray-300 px-4 py-2.5 text-sm font-semibold text-gray-700 hover:bg-gray-50 dark:border-gray-600 dark:text-gray-300 dark:hover:bg-gray-700 transition">Cancel</button>
                    <button type="submit" [disabled]="isSubmitting" class="flex-1 rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700 disabled:opacity-50 transition">
                        <span *ngIf="!isSubmitting">Create Exam</span>
                        <span *ngIf="isSubmitting" class="flex items-center justify-center gap-2">
                            <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                            Creating...
                        </span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
