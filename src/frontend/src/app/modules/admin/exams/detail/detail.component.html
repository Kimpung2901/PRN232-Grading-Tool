<div class="flex min-h-full w-full flex-col bg-[#F1F5F9] dark:bg-transparent" *ngIf="detail">
    <!-- ─── Breadcrumb Header ─────────────────────────────────────────── -->
    <div class="flex items-center justify-between border-b bg-white px-8 py-4 text-sm dark:bg-card">
        <span class="font-semibold text-gray-800 dark:text-white">Exam Detail</span>
        <div class="text-secondary flex items-center gap-1">
            <span>Dashboard</span>
            <span>•</span>
            <a class="cursor-pointer hover:text-primary" [routerLink]="['/exams', 'dashboard']">Exams</a>
            <span>•</span>
            <span class="font-semibold text-primary">Detail</span>
        </div>
    </div>

    <div class="mx-8 mt-6">
        <!-- HEADER ────────────────────────────────────────────────────────── -->
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white tracking-tight">
                    {{ detail.examName }}
                </h1>
                <div class="text-secondary mt-1 text-sm flex items-center gap-3">
                    <span>ID: {{ detail.examId }}</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
            <div class="flex items-center gap-3">
                <button
                    class="rounded-lg bg-white border border-gray-200 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 flex items-center gap-2 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-200 dark:hover:bg-gray-700"
                >
                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                    </svg>
                    Edit
                </button>
            </div>
        </div>

        <!-- TABS ──────────────────────────────────────────────────────────── -->
        <div class="mt-6 border-b border-gray-200 dark:border-gray-700">
            <nav class="-mb-px flex space-x-8" aria-label="Tabs">
                <button
                    (click)="activeTab = 'overview'"
                    [class.border-indigo-500]="activeTab === 'overview'"
                    [class.text-indigo-600]="activeTab === 'overview'"
                    [class.dark:text-indigo-400]="activeTab === 'overview'"
                    [class.border-transparent]="activeTab !== 'overview'"
                    [class.text-gray-500]="activeTab !== 'overview'"
                    [class.hover:border-gray-300]="activeTab !== 'overview'"
                    [class.hover:text-gray-700]="activeTab !== 'overview'"
                    class="whitespace-nowrap border-b-2 py-4 px-1 text-sm font-medium transition-colors"
                >
                    Overview
                </button>
                <button
                    [routerLink]="['/exams', detail.examId, 'test-cases']"
                    class="whitespace-nowrap border-b-2 border-transparent py-4 px-1 text-sm font-medium text-gray-500 hover:border-gray-300 hover:text-gray-700 transition-colors dark:text-gray-400 dark:hover:text-gray-300"
                >
                    Test Cases
                </button>
                <button
                    [routerLink]="['/exams', 'data']"
                    class="whitespace-nowrap border-b-2 border-transparent py-4 px-1 text-sm font-medium text-gray-500 hover:border-gray-300 hover:text-gray-700 transition-colors dark:text-gray-400 dark:hover:text-gray-300"
                >
                    Data Files
                </button>
            </nav>
        </div>
    </div>

    <!-- ─── Body Grid ─────────────────────────────────────────────────── -->
    <div class="mx-8 my-6 grid grid-cols-1 gap-6 lg:grid-cols-3" *ngIf="activeTab === 'overview'">
        <!-- ═══ LEFT COLUMN ══════════════════════════════════════════════ -->
        <div class="space-y-6 lg:col-span-2">
            <!-- Exam Info Card -->
            <div class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm dark:bg-card">
                <div class="border-gray-100 dark:border-gray-800">
                    <h3 class="font-bold text-gray-900 mb-4 dark:text-white">File Paths</h3>
                    <div class="grid grid-cols-1 gap-4">

                        <!-- Database File Path -->
                        <div class="rounded-xl border border-gray-100 bg-gray-50 p-4 flex items-start gap-4 dark:bg-gray-800 dark:border-gray-700">
                            <div class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-lg bg-blue-100 dark:bg-blue-900/40">
                                <svg class="h-5 w-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
                                </svg>
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-medium text-gray-900 dark:text-white">Database Initialization Script</p>
                                <p class="text-xs text-gray-500 font-mono mt-1 break-all bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded inline-block">{{ detail.sqlScriptPath || 'N/A' }}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ═══ RIGHT SIDEBAR ════════════════════════════════════════════ -->
        <div class="space-y-6">
            <!-- Actions -->
            <div class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm dark:bg-card">
                <h3 class="font-bold text-gray-900 mb-4 dark:text-white">Actions</h3>
                
                <div class="mt-2 pt-2">
                    <button [routerLink]="['/exams', detail.examId, 'test-cases']" class="w-full flex justify-center items-center gap-2 rounded-xl bg-indigo-50 px-4 py-2 text-sm font-medium text-indigo-600 transition hover:bg-indigo-100 dark:bg-indigo-500/10 dark:text-indigo-400 dark:hover:bg-indigo-500/20">
                        Manage Test Cases
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                    </button>
                    <button [routerLink]="['/submissions', 'dashboard']" class="w-full mt-3 flex justify-center items-center gap-2 rounded-xl bg-gray-50 border border-gray-200 px-4 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-100 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700">
                        View Submissions
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
