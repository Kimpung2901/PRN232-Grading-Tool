services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: prn232_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "1433:1433"
    volumes:
      - ./data/sqlserver:/var/opt/mssql
